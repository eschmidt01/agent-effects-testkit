<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">Lost acknowledgement transaction trace</title>
  <desc id="desc">A refund request commits, its acknowledgement is lost, and a retry creates a second refund. A final-state contract expected one refund and observed two. The reduced counterexample contains one order and one timeout-after-commit fault.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#6e7681"/></marker>
  </defs>
  <rect width="1400" height="500" fill="#0d1117"/>
  <rect width="1400" height="58" fill="#161b22"/>
  <path d="M0 58H1400" stroke="#30363d"/>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text x="32" y="36" fill="#e6edf3" font-size="17" font-weight="600">transaction trace</text>
    <text x="199" y="36" fill="#8b949e" font-size="15">refund_cardinality · timeout_after_commit</text>
    <rect x="1253" y="18" width="115" height="24" rx="12" fill="#490202" stroke="#f85149"/>
    <text x="1310.5" y="35" fill="#ff7b72" font-size="13" font-weight="700" text-anchor="middle">CONTRACT FAILED</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="32" y="99" fill="#8b949e" font-size="13" font-weight="600" letter-spacing="1">EXECUTION</text>
    <path d="M112 152H332M388 152H608M664 152H884M940 152H1160" stroke="#6e7681" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(84 124)">
      <circle cx="28" cy="28" r="27" fill="#0d1117" stroke="#6e7681" stroke-width="2"/>
      <text x="28" y="34" fill="#8b949e" font-size="16" font-weight="700" text-anchor="middle">01</text>
      <text x="28" y="79" fill="#e6edf3" font-size="17" font-weight="600" text-anchor="middle">refund request</text>
      <text x="28" y="103" fill="#8b949e" font-size="14" text-anchor="middle">order ord_001</text>
    </g>
    <g transform="translate(360 124)">
      <circle cx="28" cy="28" r="27" fill="#0f2d1d" stroke="#3fb950" stroke-width="2"/>
      <path d="M17 28l7 7 15-16" fill="none" stroke="#3fb950" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
      <text x="28" y="79" fill="#e6edf3" font-size="17" font-weight="600" text-anchor="middle">durable commit</text>
      <text x="28" y="103" fill="#3fb950" font-size="14" text-anchor="middle">refund #1</text>
    </g>
    <g transform="translate(636 124)">
      <circle cx="28" cy="28" r="27" fill="#332701" stroke="#d29922" stroke-width="2"/>
      <path d="M18 18l20 20M38 18L18 38" stroke="#d29922" stroke-linecap="round" stroke-width="3"/>
      <text x="28" y="79" fill="#e6edf3" font-size="17" font-weight="600" text-anchor="middle">acknowledgement lost</text>
      <text x="28" y="103" fill="#d29922" font-size="14" text-anchor="middle">timeout_after_commit</text>
    </g>
    <g transform="translate(912 124)">
      <circle cx="28" cy="28" r="27" fill="#0c2d4a" stroke="#58a6ff" stroke-width="2"/>
      <path d="M17 24a13 13 0 1 1 4 13M16 17l1 9 9-2" fill="none" stroke="#58a6ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
      <text x="28" y="79" fill="#e6edf3" font-size="17" font-weight="600" text-anchor="middle">retry</text>
      <text x="28" y="103" fill="#8b949e" font-size="14" text-anchor="middle">same business intent</text>
    </g>
    <g transform="translate(1188 124)">
      <circle cx="28" cy="28" r="27" fill="#490202" stroke="#f85149" stroke-width="2"/>
      <text x="28" y="34" fill="#ff7b72" font-size="16" font-weight="700" text-anchor="middle">02</text>
      <text x="28" y="79" fill="#e6edf3" font-size="17" font-weight="600" text-anchor="middle">second refund</text>
      <text x="28" y="103" fill="#ff7b72" font-size="14" text-anchor="middle">refund #2</text>
    </g>

    <text x="32" y="300" fill="#8b949e" font-size="13" font-weight="600" letter-spacing="1">FINAL-STATE CONTRACT</text>
    <rect x="32" y="318" width="848" height="136" rx="6" fill="#161b22" stroke="#30363d"/>
    <path d="M298 318V454M572 318V454" stroke="#30363d"/>
    <text x="58" y="349" fill="#8b949e" font-size="13" font-weight="600">EXPECTED</text>
    <text x="58" y="397" fill="#3fb950" font-size="36" font-weight="700">1 refund</text>
    <text x="324" y="349" fill="#8b949e" font-size="13" font-weight="600">OBSERVED</text>
    <text x="324" y="397" fill="#ff7b72" font-size="36" font-weight="700">2 refunds</text>
    <text x="598" y="349" fill="#8b949e" font-size="13" font-weight="600">FAILURE SIGNATURE</text>
    <text x="598" y="382" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" font-weight="600">duplicate_business_effect</text>
    <text x="598" y="408" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">refund_cardinality</text>

    <rect x="904" y="318" width="464" height="136" rx="6" fill="#0d1117" stroke="#58a6ff"/>
    <text x="930" y="349" fill="#58a6ff" font-size="13" font-weight="700">REDUCED COUNTEREXAMPLE</text>
    <text x="930" y="391" fill="#e6edf3" font-size="27" font-weight="700">1 order · 1 fault</text>
    <text x="930" y="421" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">timeout_after_commit @ occurrence 1</text>
  </g>
</svg>
