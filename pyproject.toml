[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-effects-testkit"
version = "0.1.0a2"
description = "Test the world your AI agent leaves behind"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Agent Effects contributors" }]
keywords = [
  "ai-agents",
  "testing",
  "property-based-testing",
  "fault-injection",
  "idempotency",
  "reliability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.8,<3",
  "rich>=13.7,<16",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/eschmidt01/agent-effects-testkit"
Repository = "https://github.com/eschmidt01/agent-effects-testkit"
Issues = "https://github.com/eschmidt01/agent-effects-testkit/issues"
Changelog = "https://github.com/eschmidt01/agent-effects-testkit/blob/main/CHANGELOG.md"
Documentation = "https://github.com/eschmidt01/agent-effects-testkit/tree/main/docs"

[project.optional-dependencies]
http = ["httpx>=0.27,<1"]
hypothesis = ["hypothesis>=6.112,<7"]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6.112,<7",
  "jsonschema>=4.23,<5",
  "mypy>=1.11,<2",
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.15,<1",
  "types-jsonschema>=4.23,<5",
  "twine>=6,<7",
]
docs = ["mkdocs-material>=9.5,<10"]

[project.scripts]
agent-effects = "agent_effects.cli:app"
aet = "agent_effects.cli:app"

[project.entry-points.pytest11]
agent_effects = "agent_effects_pytest"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["agent_effects_pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_effects = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "agent_effects: contract tests for side-effecting agents",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF029"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
files = ["src/agent_effects"]

[tool.coverage.run]
branch = true
source = ["agent_effects"]
omit = [
  "src/agent_effects/__init__.py",
  "src/agent_effects/pytest_plugin.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
